<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <div class="header">
      <h3>Basecamp Simple Timer</h3>
      <button id="addBtn" class="add-btn" aria-label="Start timer" title="Start timer">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 6v6l3.644 1.822"></path>
          <path d="M16 19h6"></path>
          <path d="M19 16v6"></path>
          <path d="M21.92 13.267a10 10 0 1 0-8.653 8.653"></path>
        </svg>
      </button>
    </div>

    <div class="settings">
      <div class="settings-main">
        <div id="authStatus" class="settings-status">Not connected</div>
        <div class="auth-row">
          <button id="connectBtn" class="settings-btn">Connect</button>
          <button id="connectionMenuBtn" class="connection-menu-btn" type="button" aria-label="Show connection actions" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
        </div>
      </div>
      <div id="connectionMenu" class="connection-menu hidden">
        <button id="disconnectBtn" class="settings-btn secondary">Disconnect</button>
      </div>
    </div>

    <div id="errorMsg" class="error hidden"></div>
    <div id="successMsg" class="success hidden"></div>

    <ul id="taskList">
      <!-- Tasks injected here by JS -->
    </ul>

    <!-- Empty state template -->
    <div id="emptyState" class="empty-state hidden">
      <span class="empty-state-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M10 2h4"></path>
          <path d="M12 14v-4"></path>
          <path d="M12 14l3 2"></path>
          <circle cx="12" cy="14" r="8"></circle>
        </svg>
      </span>
      <span>No timers yet. Navigate to a Basecamp task and click <strong>"+ Start Timer"</strong> to begin.</span>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
